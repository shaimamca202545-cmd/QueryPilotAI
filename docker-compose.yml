services:
  querypilot:
    build: .
    container_name: querypilot-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: 3306
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped